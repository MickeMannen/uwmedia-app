# The default test suite on the self-hosted Gitea runners, for every branch
# push (development branches only go to Gitea), by hand, and nightly with
# everything, the Mac App Store variant's build included. Gitea reads .gitea/workflows/ and leaves the GitHub workflow
# alone.
#
# Runners (owner, 2026-11-15): `linux-docker` (Docker mode; the job runs in
# the Flutter image), `macos-host` and `windows-host` (host mode: the job
# runs straight on the machine, which needs Flutter and git on PATH).
# The media tests run the ffmpeg, ffprobe and exiftool the apps ship
# with on every runner (owner, 2026-11-23): tool/run_tests.sh puts them
# first on the PATH (tool/own_tools.sh), where the Mac had Homebrew's and
# the Windows job fetched gyan.dev's build.
#
# The private test data is on a read-only SMB share on the LAN (never in
# git, never in Gitea), kept the same as the development machine's
# test_data/ by the pre-push hook (tool/test_data_sync.sh). Where it is
# and who reads it are the repo's Actions variables TEST_DATA_SHARE
# (//host/share) and TEST_DATA_USER, its password the secret
# TEST_DATA_PASSWORD (Gitea: the repo's Settings, Actions); nothing of the
# home network is in the repo. Each job connects it (tool/ci_test_data.sh);
# without them the tests that use the data skip themselves.
#
# Keep the Linux job's FLUTTER_VERSION and the host runners' Flutter in
# step with FLUTTER_VERSION in .github/workflows/tests.yml and the local
# Flutter.

name: Tests

on:
  push:
  workflow_dispatch:
  schedule:
    # Nightly "Everything" run (release tests and goldens) at 03:30.
    - cron: '30 3 * * *'

# One run at a time: the Linux runner and the Windows VM share a server,
# and two runs at once made both slow enough to fail (runs 154 and 156,
# a push and a run by hand). A second run waits; none is cancelled.
concurrency:
  group: tests
  cancel-in-progress: false

env:
  TEST_DATA_SHARE: ${{ vars.TEST_DATA_SHARE }}
  TEST_DATA_USER: ${{ vars.TEST_DATA_USER }}
  TEST_DATA_PASSWORD: ${{ secrets.TEST_DATA_PASSWORD }}

jobs:
  linux:
    name: Tests (Linux)
    runs-on: linux-docker
    # The newest Flutter image there is (the images stopped at 3.44.0); the
    # first step moves its SDK to the version the app is built with. The
    # image has no Node, which the checkout action runs on, so the second
    # step puts one in.
    container:
      image: ghcr.io/cirruslabs/flutter:3.44.0
    env:
      FLUTTER_VERSION: '3.47.7'
      NODE_VERSION: '20.18.1'
    steps:
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git config --global --add safe.directory '*'
          git -C "$FLUTTER_HOME" fetch --depth 1 origin tag "$FLUTTER_VERSION"
          git -C "$FLUTTER_HOME" checkout -f "$FLUTTER_VERSION"
          flutter --version

      - name: Node ${{ env.NODE_VERSION }}
        run: |
          case "$(uname -m)" in aarch64 | arm64) arch=arm64 ;; *) arch=x64 ;; esac
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-$arch.tar.gz" |
            tar -xz -C /usr/local --strip-components=1
          node --version

      # What copies the test data from its share, and Perl's modules for
      # exiftool. Tried again when the archive does not answer
      # (2026-11-19: a connection timeout to archive.ubuntu.com failed
      # the job). No ffmpeg from Ubuntu: the media tests run the app's
      # own, fetched below.
      - name: exiftool's Perl and smbclient
        run: |
          for try in 1 2 3; do
            if apt-get -o Acquire::Retries=3 update -qq &&
              apt-get -o Acquire::Retries=3 install -y -qq libimage-exiftool-perl smbclient; then
              break
            fi
            [ "$try" = 3 ] && exit 1
            sleep 30
          done

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: flutter pub get

      # The media tests run the ffmpeg, ffprobe and exiftool the Linux
      # download ships (spec §13.2; tool/fetch_tools.dart, each file
      # checked against its sha256), first on the PATH, as the Windows
      # job runs the version the app has. Ubuntu's ffmpeg 6.1.1 writes a
      # Color video with shifted colours (BT.601 under the BT.709 tag;
      # roadmap v0.2.0 E6), which failed the comparison's test here
      # (owner, 2026-11-22).
      - name: The app's own ffmpeg, ffprobe and exiftool
        run: |
          dart run tool/fetch_tools.dart linux "$PWD/build/ci_tools"
          echo "$PWD/build/ci_tools" >> "$GITHUB_PATH"
          "$PWD/build/ci_tools/ffmpeg" -version | head -1
          "$PWD/build/ci_tools/exiftool" -ver

      - name: Test data
        run: tool/ci_test_data.sh ${{ github.event_name == 'schedule' && 'release' || '' }}

      - name: Default suite
        if: github.event_name != 'schedule'
        run: tool/run_tests.sh 1

      # The fonts draw as on the Mac (roadmap E1, 2026-11-21).
      - name: Compare overlay golden images
        if: github.event_name != 'schedule'
        run: flutter test --tags golden

      - name: Everything
        if: github.event_name == 'schedule'
        run: tool/run_tests.sh 4

      # Last, so that the tests have run: a run whose data tests skipped
      # because the variables are gone is not green.
      - name: Test data was set up
        if: ${{ !cancelled() }}
        run: tool/ci_test_data.sh check

  macos:
    name: Tests (macOS)
    runs-on: macos-host
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: flutter pub get

      - name: Test data
        run: tool/ci_test_data.sh ${{ github.event_name == 'schedule' && 'release' || '' }}

      - name: Default suite
        if: github.event_name != 'schedule'
        run: tool/run_tests.sh 1

      - name: Compare overlay golden images
        if: github.event_name != 'schedule'
        run: flutter test --tags golden

      - name: Everything
        if: github.event_name == 'schedule'
        run: tool/run_tests.sh 4

      # The Mac App Store variant (spec §10.74: no ffmpeg, no exiftool,
      # the App Sandbox), built and signed ad hoc each night so that it
      # is seen to build (owner, 2026-11-25). Whatever the tests said. The
      # app is not started: that would make its container in the runner's
      # Library. It stays in the runner's build/store/ until the next run.
      - name: Build the Mac App Store variant
        if: ${{ github.event_name == 'schedule' && !cancelled() }}
        run: |
          tool/build_store.sh
          app=build/store/UWMedia.app
          rights=$(codesign -d --entitlements - "$app" 2>/dev/null)
          case "$rights" in
            *com.apple.security.app-sandbox*) ;;
            *) echo "::error::The store build is not signed for the App Sandbox"; exit 1 ;;
          esac
          tools=$(find "$app" \( -name ffmpeg -o -name ffprobe -o -name exiftool \))
          if [ -n "$tools" ]; then
            echo "::error::The store build holds ffmpeg, ffprobe or exiftool: $tools"
            exit 1
          fi

  # The runner's service has no bash on its PATH, so the steps find the one
  # that comes with Git for Windows, next to the git that Flutter uses.

      # Last, so that the tests have run: a run whose data tests skipped
      # because the variables are gone is not green.
      - name: Test data was set up
        if: ${{ !cancelled() }}
        run: tool/ci_test_data.sh check

  windows:
    name: Tests (Windows)
    runs-on: windows-host
    # The Windows VM and the Linux runner share a server: run together, the
    # overlay batch test passed its five minutes on both (runs 149, 151).
    # After the Linux job, whatever its result.
    needs: linux
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: flutter pub get

      - name: Test data
        run: |
          if (-not $env:TEST_DATA_PASSWORD -or -not $env:TEST_DATA_SHARE) {
            echo "No TEST_DATA_SHARE or TEST_DATA_PASSWORD: the tests that need the data will skip."
            exit 0
          }
          $share = $env:TEST_DATA_SHARE.Replace('/', '\')
          # Connecting again what is connected already is no error.
          net use $share $env:TEST_DATA_PASSWORD /user:$env:TEST_DATA_USER /persistent:no
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "UWMEDIA_TEST_DATA=$env:TEST_DATA_SHARE"

      - name: Default suite
        if: github.event_name != 'schedule'
        run: |
          $bash = Join-Path (Split-Path (Split-Path (Get-Command git).Source)) 'bin\bash.exe'
          & $bash tool/run_tests.sh 1
          exit $LASTEXITCODE

      # The fonts draw as on the Mac (roadmap E1, 2026-11-21).
      - name: Compare overlay golden images
        if: github.event_name != 'schedule'
        run: |
          flutter test --tags golden
          exit $LASTEXITCODE

      - name: Everything
        if: github.event_name == 'schedule'
        run: |
          $bash = Join-Path (Split-Path (Split-Path (Get-Command git).Source)) 'bin\bash.exe'
          & $bash tool/run_tests.sh 4
          exit $LASTEXITCODE

      # Last, so that the tests have run: a run whose data tests skipped
      # because the variables are gone is not green.
      - name: Test data was set up
        if: ${{ !cancelled() }}
        run: |
          if ($env:TEST_DATA_PASSWORD -and (-not $env:TEST_DATA_SHARE -or -not $env:TEST_DATA_USER)) {
            echo "::error::The secret TEST_DATA_PASSWORD is set, but the Actions variable TEST_DATA_SHARE or TEST_DATA_USER is empty: the tests that need the private test data were SKIPPED in this run. Add the variables in Gitea (the repo's Settings, Actions, Variables)."
            exit 1
          }
